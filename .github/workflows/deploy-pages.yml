name: Build and Deploy Wiki to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout TBB-WIKI
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Checkout XWiki engine
        uses: actions/checkout@v4
        with:
          repository: XLord-Heliukum/XWiki
          path: .xwiki-engine

      - name: Install XWiki dependencies
        working-directory: .xwiki-engine
        run: npm install

      - name: Build site into ./output
        run: |
          node .xwiki-engine/bin/ursa.js generate content ./output || true
          test -f ./output/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./output

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
